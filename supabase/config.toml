project_id = "aullweizxcjbvtdspjli"

[functions.fetch-inbound-emails]
verify_jwt = false

# Appelée uniquement par pg_cron, qui n'envoie pas d'en-tête Authorization :
# avec verify_jwt, la plateforme rejetterait l'appel avant même d'exécuter le
# code. L'authentification se fait par x-cron-secret dans la fonction.
[functions.process-analysis-queue]
verify_jwt = false

[functions.auth-email-hook]
verify_jwt = false

# Appelée par pg_cron via trigger_socle_sync() (03:00), qui n'envoie aucun
# en-tête Authorization. L'entrée manquait : la fonction n'avait survécu que
# parce qu'elle était déployée à la main avec --no-verify-jwt, et le premier
# déploiement par la CLI la remettait en 401 (constaté le 2026-08-23).
# L'authentification réelle se fait dans la fonction (x-cron-secret, service
# role, ou JWT superadmin/admin).
[functions.sync-socle-referentiel]
verify_jwt = false

# Réconciliation nocturne des demandes Iris, appelée par pg_cron (aucun en-tête
# Authorization). `push-iris-request`, lui, garde la vérification : il est
# appelé par le navigateur avec le JWT de l'agent.
[functions.sync-iris-requests]
verify_jwt = false

[functions.portal-form]
verify_jwt = false

# Facteur des notifications push, appelé par pg_cron (trigger_notifications_push),
# qui n'envoie aucun en-tête Authorization. L'authentification réelle se fait dans
# la fonction (x-cron-secret comparé à get_cron_secret()).
[functions.notifications-push]
verify_jwt = false

# Ces deux-là font leur propre authentification (JWT de l'appelant relu par la
# fonction, puis rôle `administrateur` ou `is_superadmin` exigé) et tournent en
# production avec `verify_jwt = false` depuis toujours — sans entrée ici, le
# premier déploiement par la CLI leur réappliquait le défaut `true`, la dérive
# décrite en tête de docs/deployment.md. L'entrée fige l'état réel.
[functions.send-password-reset]
verify_jwt = false

[functions.invite-user]
verify_jwt = false
